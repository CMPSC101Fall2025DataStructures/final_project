# GatorGrade configuration for Final Project
# This checks baseline requirements for the final project submission

# Check that README.md exists and has comprehensive documentation
- ./writing/README.md:
    - description: ./writing/README.md Ensure file exists
      check: ConfirmFileExists
    - description: ./writing/README.md contains no TODO markers should remain (all sections completed)
      check: MatchFileFragment
      options:
        fragment: "TODO"
        count: 0
        exact: true
    - description: ./writing/README.md Student(s) added their name 
      check: MatchFileFragment
      options:
        fragment: "Add Your Name Here"
        count: 0
        exact: true
    # - description: README has substantial documentation (at least 400 words)
    #   check: CountFileWords
    #   options:
    #     count: 400
    #     exact: false

